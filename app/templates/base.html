<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SA41 · Research Terminal{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ========================================================================
           Research Terminal Design System
           ======================================================================== */
        :root {
            color-scheme: light dark;

            /* === Dark (default) === */
            --rt-bg:            #0d1117;
            --rt-surface:       #151a22;
            --rt-surface-2:     #1c222c;
            --rt-surface-hover: #222935;

            --rt-border:        rgba(255, 255, 255, 0.08);
            --rt-border-strong: rgba(255, 255, 255, 0.14);

            --rt-text:           #e6e6e8;
            --rt-text-secondary: #a0a4ab;
            --rt-text-muted:     #6b7280;

            --rt-success:     #4caf7d;
            --rt-success-bg:  rgba(76, 175, 125, 0.12);
            --rt-success-br:  rgba(76, 175, 125, 0.30);

            --rt-danger:      #e06060;
            --rt-danger-bg:   rgba(224, 96, 96, 0.12);
            --rt-danger-br:   rgba(224, 96, 96, 0.30);

            --rt-warning:     #e69632;
            --rt-warning-bg:  rgba(230, 150, 50, 0.12);
            --rt-warning-br:  rgba(230, 150, 50, 0.30);

            --rt-info:        #64a0e6;
            --rt-info-bg:     rgba(100, 160, 230, 0.12);
            --rt-info-br:     rgba(100, 160, 230, 0.30);

            --rt-neutral:     #9aa0a6;
            --rt-neutral-bg:  rgba(154, 160, 166, 0.10);
            --rt-neutral-br:  rgba(154, 160, 166, 0.25);

            --rt-accent:       #4a9eff;
            --rt-accent-hover: #2d82eb;
            --rt-on-accent:    #0d1117;

            --rt-navbar-bg:    rgba(13, 17, 23, 0.85);
            --rt-hover-tint:   rgba(255, 255, 255, 0.02);

            --rt-shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --rt-shadow-md: 0 4px 12px rgba(0,0,0,0.35);
            --rt-shadow-lg: 0 12px 28px rgba(0,0,0,0.45);

            /* Radii */
            --rt-r-sm: 6px;
            --rt-r-md: 10px;
            --rt-r-lg: 14px;
            --rt-r-full: 999px;

            /* Fonts */
            --rt-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --rt-font-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
        }

        /* === Light (follows OS) === */
        @media (prefers-color-scheme: light) {
            :root {
                --rt-bg:            #ffffff;
                --rt-surface:       #f6f8fa;
                --rt-surface-2:     #eef1f4;
                --rt-surface-hover: #e4e9ee;

                --rt-border:        rgba(0, 0, 0, 0.08);
                --rt-border-strong: rgba(0, 0, 0, 0.16);

                --rt-text:           #1a1f2a;
                --rt-text-secondary: #4a5260;
                --rt-text-muted:     #7a8290;

                --rt-success:     #2f8f5c;
                --rt-success-bg:  rgba(47, 143, 92, 0.10);
                --rt-success-br:  rgba(47, 143, 92, 0.28);

                --rt-danger:      #c4423f;
                --rt-danger-bg:   rgba(196, 66, 63, 0.09);
                --rt-danger-br:   rgba(196, 66, 63, 0.26);

                --rt-warning:     #b56a12;
                --rt-warning-bg:  rgba(181, 106, 18, 0.10);
                --rt-warning-br:  rgba(181, 106, 18, 0.28);

                --rt-info:        #2d82eb;
                --rt-info-bg:     rgba(45, 130, 235, 0.08);
                --rt-info-br:     rgba(45, 130, 235, 0.24);

                --rt-neutral:     #6b7280;
                --rt-neutral-bg:  rgba(107, 114, 128, 0.08);
                --rt-neutral-br:  rgba(107, 114, 128, 0.22);

                --rt-accent:       #2d82eb;
                --rt-accent-hover: #1d6fd2;
                --rt-on-accent:    #ffffff;

                --rt-navbar-bg:    rgba(255, 255, 255, 0.80);
                --rt-hover-tint:   rgba(0, 0, 0, 0.025);

                --rt-shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
                --rt-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
                --rt-shadow-lg: 0 12px 28px rgba(0,0,0,0.12);
            }
        }

        /* ========================================================================
           Reset & base
           ======================================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--rt-font-sans);
            background: var(--rt-bg);
            color: var(--rt-text);
            min-height: 100vh;
            line-height: 1.55;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        a { color: var(--rt-accent); text-decoration: none; transition: color 0.15s ease; }
        a:hover { color: var(--rt-accent-hover); }
        .rt-mono { font-family: var(--rt-font-mono); font-variant-numeric: tabular-nums; }

        /* ========================================================================
           Navbar
           ======================================================================== */
        .rt-navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: var(--rt-navbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--rt-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 24px;
        }
        .rt-navbar__brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--rt-text);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
        }
        .rt-navbar__brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px; height: 22px;
            border-radius: 5px;
            background: linear-gradient(135deg, #4a9eff 0%, #64a0e6 100%);
            color: #0d1117;
            font-family: var(--rt-font-mono);
            font-weight: 700;
            font-size: 11px;
        }
        .rt-navbar__brand-label {
            color: var(--rt-text);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.2px;
        }
        .rt-navbar__links {
            margin-left: 24px;
            display: flex;
            gap: 20px;
        }
        .rt-navbar__link {
            color: var(--rt-text-secondary);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .rt-navbar__link:hover,
        .rt-navbar__link.is-active { color: var(--rt-text); }

        .rt-main { padding-top: 52px; min-height: 100vh; }

        /* ========================================================================
           Containers / page chrome
           ======================================================================== */
        .rt-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 24px 64px;
        }
        .rt-container--narrow { max-width: 960px; }
        .rt-container--wide   { max-width: 1440px; }

        .rt-hero { padding: 32px 0 16px; }
        .rt-hero__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--rt-text-muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 8px;
        }
        .rt-hero__title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            line-height: 1.2;
            margin: 0;
        }
        .rt-hero__subtitle {
            font-size: 14px;
            color: var(--rt-text-secondary);
            margin-top: 6px;
        }
        .rt-hero__meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 12px;
            color: var(--rt-text-secondary);
            font-size: 13px;
        }
        .rt-hero__meta-dot {
            width: 3px; height: 3px;
            background: var(--rt-text-muted);
            border-radius: 50%;
            display: inline-block;
        }

        /* ========================================================================
           Section title (between hero and body)
           ======================================================================== */
        .rt-section-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--rt-text-muted);
            margin: 0 0 10px;
        }
        .rt-caption {
            font-size: 12px;
            color: var(--rt-text-muted);
        }

        /* ========================================================================
           Cards
           ======================================================================== */
        .rt-card {
            background: var(--rt-surface);
            border: 1px solid var(--rt-border);
            border-radius: var(--rt-r-lg);
            padding: 20px;
            transition: border-color 0.15s ease, transform 0.15s ease;
        }
        .rt-card--flat { padding: 14px; }
        .rt-card--hover:hover {
            border-color: var(--rt-border-strong);
            transform: translateY(-1px);
        }
        .rt-card__header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 14px;
        }
        .rt-card__title {
            font-size: 15px;
            font-weight: 600;
            color: var(--rt-text);
            margin: 0;
        }
        .rt-card__subtitle {
            font-size: 12px;
            color: var(--rt-text-muted);
            margin-top: 2px;
        }

        /* ========================================================================
           Badges (status)
           ======================================================================== */
        .rt-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--rt-r-full);
            border: 1px solid var(--rt-border);
            background: var(--rt-surface-2);
            color: var(--rt-text-secondary);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .rt-badge::before {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .rt-badge--success { color: var(--rt-success); background: var(--rt-success-bg); border-color: var(--rt-success-br); }
        .rt-badge--danger  { color: var(--rt-danger);  background: var(--rt-danger-bg);  border-color: var(--rt-danger-br); }
        .rt-badge--warning { color: var(--rt-warning); background: var(--rt-warning-bg); border-color: var(--rt-warning-br); }
        .rt-badge--info    { color: var(--rt-info);    background: var(--rt-info-bg);    border-color: var(--rt-info-br); }
        .rt-badge--neutral { color: var(--rt-neutral); background: var(--rt-neutral-bg); border-color: var(--rt-neutral-br); }

        .rt-badge--lg { padding: 6px 14px; font-size: 13px; }
        .rt-badge--plain::before { display: none; }

        /* ========================================================================
           Routing banner — page-level routing mode indicator
           ======================================================================== */
        .rt-routing-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 20px;
            border-radius: var(--rt-r-lg);
            border: 1px solid var(--rt-border);
            background: var(--rt-surface);
            margin-bottom: 20px;
        }
        .rt-routing-banner__mode {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .rt-routing-banner__label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--rt-text-muted);
        }
        .rt-routing-banner__value {
            font-size: 16px;
            font-weight: 600;
            color: var(--rt-text);
            letter-spacing: -0.2px;
        }
        .rt-routing-banner__desc {
            font-size: 13px;
            color: var(--rt-text-secondary);
            max-width: 60%;
            text-align: right;
        }
        .rt-routing-banner--dominant { border-left: 3px solid var(--rt-success); }
        .rt-routing-banner--mixed    { border-left: 3px solid var(--rt-info); }
        .rt-routing-banner--degraded { border-left: 3px solid var(--rt-warning); }

        /* ========================================================================
           Attribution bar — segmented horizontal visualization
           ======================================================================== */
        .rt-attribution-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .rt-attribution-row {
            display: grid;
            grid-template-columns: 60px 1fr 54px;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }
        .rt-attribution-row__label {
            color: var(--rt-text-secondary);
            font-weight: 500;
        }
        .rt-attribution-row__track {
            position: relative;
            height: 8px;
            background: var(--rt-surface-2);
            border-radius: var(--rt-r-full);
            overflow: hidden;
        }
        .rt-attribution-row__fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            border-radius: var(--rt-r-full);
            transition: width 0.3s ease;
        }
        .rt-attribution-row__fill--firm     { background: var(--rt-info); }
        .rt-attribution-row__fill--industry { background: var(--rt-success); }
        .rt-attribution-row__fill--market   { background: var(--rt-warning); }
        .rt-attribution-row__fill--alpha    { background: var(--rt-text-muted); }
        /* Legacy single-direction dim for negative values; not used by the
           bidirectional bar (sign is conveyed by left/right anchoring). Kept
           for any future single-direction caller. */
        .rt-attribution-row__fill--negative { opacity: 0.45; }
        /* Bidirectional bar — center is 0%, fill grows leftward for negative
           values and rightward for positive. Each half of the track represents
           0..100% of the value's magnitude. Inline width is computed as
           |val| * 0.5% (so 42 → 21% of total track = 42% of half). */
        .rt-attribution-row__track--bidir::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--rt-border-strong);
            transform: translateX(-0.5px);
            z-index: 0;
        }
        .rt-attribution-row__fill--pos {
            left: 50%;
            right: auto;
            z-index: 1;
        }
        .rt-attribution-row__fill--neg {
            right: 50%;
            left: auto;
            z-index: 1;
        }
        .rt-attribution-row__value {
            font-family: var(--rt-font-mono);
            font-variant-numeric: tabular-nums;
            color: var(--rt-text);
            font-weight: 600;
            text-align: right;
        }

        /* ========================================================================
           Branch trigger cards + drawer panels (Option D — mixed-routing UI)
           ======================================================================== */
        .rt-branch-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }
        @media (max-width: 760px) {
            .rt-branch-row { grid-template-columns: 1fr; }
        }
        .rt-branch-card {
            position: relative;
            padding: 16px 18px 18px 22px;
            border-radius: var(--rt-r-lg);
            border: 1px solid var(--rt-border);
            background: var(--rt-surface);
            cursor: pointer;
            overflow: hidden;
            transition:
                transform 220ms cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 220ms cubic-bezier(0.4, 0, 0.2, 1),
                border-color 220ms cubic-bezier(0.4, 0, 0.2, 1),
                background 220ms cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        .rt-branch-card::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 3px;
            background: var(--rt-border);
            transition: width 250ms cubic-bezier(0.4, 0, 0.2, 1), background 220ms ease;
        }
        .rt-branch-card--firm::before     { background: var(--rt-info); }
        .rt-branch-card--industry::before { background: var(--rt-success); }
        .rt-branch-card--market::before   { background: var(--rt-warning); }
        .rt-branch-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px -12px rgba(0,0,0,0.22);
            border-color: var(--rt-border);
        }
        .rt-branch-card.is-active {
            border-color: var(--rt-accent);
            background: var(--rt-surface-2);
        }
        .rt-branch-card.is-active::before { width: 5px; }
        .rt-branch-card__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }
        .rt-branch-card__name {
            font-size: 15px;
            font-weight: 600;
            color: var(--rt-text);
            letter-spacing: 0.2px;
        }
        .rt-branch-card__driver {
            font-size: 13px;
            line-height: 1.5;
            color: var(--rt-text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
        }
        .rt-branch-card__foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 12px;
            color: var(--rt-text-muted);
        }
        /* Component-share pill rendered in the card header next to the
           evidence badge — same signed share that §3 Layer 1 shows, repeated
           here so the viewer sees which branch is doing what work without
           scrolling back up. Bigger + sign-tinted so it reads as the card's
           "headline number" rather than a meta tag. */
        .rt-branch-card__share {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: var(--rt-r-sm);
            background: var(--rt-surface-2);
            color: var(--rt-text-secondary);
            font-family: var(--rt-font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid var(--rt-border);
        }
        /* Sign-tinted share variants — green for positive contribution,
           red for negative, neutral for absolute-magnitude fallback / N/A. */
        .rt-branch-card__share--up {
            color: var(--rt-success);
            background: var(--rt-success-bg);
            border-color: var(--rt-success-br);
        }
        .rt-branch-card__share--down {
            color: var(--rt-danger);
            background: var(--rt-danger-bg);
            border-color: var(--rt-danger-br);
        }
        .rt-branch-card__share--mag,
        .rt-branch-card__share--na {
            /* keep neutral; --mag is the absolute-magnitude fallback used
               for near-zero episodes where sign is unreliable. */
        }
        /* Tiny "PRIMARY" pill in the card header — only rendered for the
           dominant-mode primary branch. */
        .rt-branch-card__primary-pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            border-radius: var(--rt-r-sm);
            background: var(--rt-accent);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            line-height: 1.4;
        }
        /* State variants — visual cue that a card is not fully ready. */
        .rt-branch-card--lazy {
            border-style: dashed;
        }
        .rt-branch-card--lazy:hover {
            border-style: solid;
        }
        .rt-branch-card--unavailable {
            opacity: 0.5;
            cursor: default;
        }
        .rt-branch-card--unavailable:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--rt-border);
        }
        /* Primary card highlight — only rendered in dominant routing for the
           primary branch. Accent border + soft glow + slight surface lift so
           the user instantly knows which card is doing the work. */
        .rt-branch-card--primary {
            border-style: solid;
            border-color: var(--rt-accent);
            background: linear-gradient(
                135deg,
                var(--rt-surface) 0%,
                var(--rt-surface-2) 100%
            );
            box-shadow: 0 0 0 1px var(--rt-accent), 0 6px 18px -10px rgba(74, 158, 255, 0.45);
        }
        .rt-branch-card--primary::before { width: 5px; }
        .rt-branch-card--primary:hover {
            box-shadow: 0 0 0 1px var(--rt-accent), 0 10px 24px -10px rgba(74, 158, 255, 0.55);
            border-color: var(--rt-accent);
        }
        /* Lazy card body — pre-click CTA + post-click loader (mutually
           exclusive; JS toggles the [hidden] attribute). */
        .rt-branch-card__cta {
            font-size: 13px;
            line-height: 1.5;
        }
        .rt-branch-card__loader {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 2px;
        }
        .rt-branch-card__loader[hidden] { display: none; }
        .rt-branch-card__loader-label {
            font-size: 12px;
            color: var(--rt-text-secondary);
            font-weight: 500;
        }
        .rt-branch-card__loader-bar {
            position: relative;
            height: 4px;
            border-radius: 2px;
            background: var(--rt-surface-2);
            overflow: hidden;
        }
        .rt-branch-card__loader-bar-fill {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -40%;
            width: 40%;
            border-radius: 2px;
            background: linear-gradient(
                90deg,
                rgba(74, 158, 255, 0) 0%,
                var(--rt-accent) 50%,
                rgba(74, 158, 255, 0) 100%
            );
            animation: rt-branch-card-loader-slide 1100ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes rt-branch-card-loader-slide {
            0%   { left: -40%; }
            100% { left: 100%; }
        }
        .rt-branch-card__chev {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 10px;
            color: var(--rt-text-muted);
            transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1), color 220ms ease;
        }
        .rt-branch-card.is-active .rt-branch-card__chev {
            transform: rotate(180deg);
            color: var(--rt-accent);
        }

        /* Drawer panel below the three trigger cards */
        .rt-branch-drawers {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }
        .rt-branch-drawer {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transform: translateY(-8px);
            transition:
                max-height 450ms cubic-bezier(0.4, 0, 0.2, 1),
                opacity 300ms cubic-bezier(0.4, 0, 0.2, 1),
                transform 350ms cubic-bezier(0.4, 0, 0.2, 1),
                margin 280ms cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0;
            will-change: max-height, opacity, transform;
        }
        .rt-branch-drawer.is-open {
            opacity: 1;
            transform: translateY(0);
            /* max-height set inline by JS to the measured scrollHeight */
        }
        .rt-branch-drawer__inner {
            padding: 20px 22px;
            border-radius: var(--rt-r-lg);
            border: 1px solid var(--rt-border);
            background: var(--rt-surface);
            position: relative;
        }
        .rt-branch-drawer__inner::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 3px;
            border-radius: var(--rt-r-lg) 0 0 var(--rt-r-lg);
        }
        .rt-branch-drawer--firm .rt-branch-drawer__inner::before     { background: var(--rt-info); }
        .rt-branch-drawer--industry .rt-branch-drawer__inner::before { background: var(--rt-success); }
        .rt-branch-drawer--market .rt-branch-drawer__inner::before   { background: var(--rt-warning); }
        .rt-branch-drawer__title {
            font-size: 15px;
            font-weight: 600;
            color: var(--rt-text);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .rt-branch-drawer__stage {
            /* inner stagger animation targets */
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 360ms cubic-bezier(0.4, 0, 0.2, 1), transform 360ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rt-branch-drawer.is-open .rt-branch-drawer__stage {
            opacity: 1;
            transform: translateY(0);
        }
        .rt-branch-drawer.is-open .rt-branch-drawer__stage--t1 { transition-delay:  40ms; }
        .rt-branch-drawer.is-open .rt-branch-drawer__stage--t2 { transition-delay: 120ms; }
        .rt-branch-drawer.is-open .rt-branch-drawer__stage--t3 { transition-delay: 200ms; }
        @media (prefers-reduced-motion: reduce) {
            .rt-branch-card,
            .rt-branch-card__chev,
            .rt-branch-drawer,
            .rt-branch-drawer__stage {
                transition: none !important;
            }
            .rt-branch-card__loader-bar-fill {
                animation: none !important;
                left: 0;
                width: 100%;
                opacity: 0.6;
            }
        }

        /* ========================================================================
           Stat block — compact label/value pair
           ======================================================================== */
        .rt-stat-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }
        .rt-stat {
            background: var(--rt-surface-2);
            border: 1px solid var(--rt-border);
            border-radius: var(--rt-r-md);
            padding: 12px 14px;
        }
        .rt-stat__label {
            font-size: 12px;
            font-weight: 600;
            color: var(--rt-text-muted);
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .rt-stat__value {
            font-family: var(--rt-font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 18px;
            font-weight: 600;
            color: var(--rt-text);
            letter-spacing: -0.2px;
        }
        .rt-stat__value--prose {
            font-family: var(--rt-font-sans);
            font-size: 14px;
        }
        .rt-stat__value--up   { color: var(--rt-success); }
        .rt-stat__value--down { color: var(--rt-danger);  }

        /* ========================================================================
           Evidence card — publisher/date → headline → snippet
           ======================================================================== */
        .rt-evidence {
            padding: 14px 16px;
            border: 1px solid var(--rt-border);
            border-radius: var(--rt-r-md);
            background: var(--rt-surface-2);
            transition: border-color 0.15s ease;
        }
        .rt-evidence:hover { border-color: var(--rt-border-strong); }
        .rt-evidence__meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--rt-text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .rt-evidence__meta-dot {
            width: 2px; height: 2px;
            background: var(--rt-text-muted);
            border-radius: 50%;
        }
        .rt-evidence__headline {
            font-size: 14px;
            font-weight: 500;
            color: var(--rt-text);
            line-height: 1.45;
            margin: 0;
        }
        .rt-evidence__headline a { color: inherit; }
        .rt-evidence__headline a:hover { color: var(--rt-accent); }
        .rt-evidence__snippet {
            font-size: 12.5px;
            color: var(--rt-text-secondary);
            line-height: 1.5;
            margin-top: 6px;
        }

        /* ========================================================================
           Bundle row — event / status / score
           ======================================================================== */
        .rt-bundle {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 14px;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid var(--rt-border);
            border-radius: var(--rt-r-md);
            background: var(--rt-surface-2);
        }
        .rt-bundle__event {
            font-size: 13px;
            font-weight: 500;
            color: var(--rt-text);
        }
        .rt-bundle__meta {
            font-size: 11px;
            color: var(--rt-text-muted);
            margin-top: 3px;
        }
        .rt-bundle__score {
            font-family: var(--rt-font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            font-weight: 600;
            color: var(--rt-text-secondary);
            min-width: 40px;
            text-align: right;
        }

        /* ========================================================================
           Buttons
           ======================================================================== */
        .rt-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--rt-r-sm);
            border: 1px solid var(--rt-border);
            background: var(--rt-surface);
            color: var(--rt-text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }
        .rt-btn:hover {
            border-color: var(--rt-border-strong);
            background: var(--rt-surface-hover);
            color: var(--rt-text);
        }
        .rt-btn--primary {
            background: var(--rt-accent);
            border-color: var(--rt-accent);
            color: var(--rt-on-accent);
            font-weight: 600;
        }
        .rt-btn--primary:hover {
            background: var(--rt-accent-hover);
            border-color: var(--rt-accent-hover);
            color: var(--rt-on-accent);
        }
        .rt-btn--ghost {
            background: transparent;
            border-color: var(--rt-border);
            color: var(--rt-text-secondary);
        }
        .rt-btn--ghost:hover {
            color: var(--rt-text);
            border-color: var(--rt-border-strong);
            background: var(--rt-surface);
        }
        .rt-btn--sm { padding: 6px 12px; font-size: 12px; }
        .rt-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ========================================================================
           Path switch — segmented tabs in the episode-detail hero (DEC-203).
           Two pills (AI Explanation / Pipeline Analysis); active tab is filled,
           inactive tab is ghosted. Used to navigate between the two parallel
           qualitative-explanation backends.
           ======================================================================== */
        .rt-path-switch {
            display: inline-flex;
            border-radius: var(--rt-r-md);
            background: var(--rt-surface);
            border: 1px solid var(--rt-border);
            padding: 3px;
            gap: 2px;
        }
        .rt-path-switch__tab {
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--rt-text-muted);
            text-decoration: none;
            border-radius: calc(var(--rt-r-md) - 3px);
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .rt-path-switch__tab:hover {
            color: var(--rt-text);
        }
        .rt-path-switch__tab.is-active {
            color: var(--rt-text);
            background: var(--rt-surface-2);
            box-shadow: inset 0 0 0 1px var(--rt-border);
        }

        /* ========================================================================
           Modal — used by the AI Recompute confirmation dialog (DEC-203).
           Hidden by default via the `hidden` HTML attribute; toggled in JS.
           ======================================================================== */
        .rt-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .rt-modal[hidden] { display: none; }
        .rt-modal__backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(2px);
        }
        .rt-modal__panel {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: var(--rt-bg);
            border: 1px solid var(--rt-border);
            border-radius: var(--rt-r-md);
            padding: 22px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* ========================================================================
           Form input (minimal)
           ======================================================================== */
        .rt-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--rt-r-sm);
            background: var(--rt-surface);
            border: 1px solid var(--rt-border);
            color: var(--rt-text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .rt-input:focus {
            border-color: var(--rt-accent);
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
        }
        .rt-input::placeholder { color: var(--rt-text-muted); }
        .rt-input-label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
            font-weight: 500;
            color: var(--rt-text-muted);
            letter-spacing: 0.3px;
        }

        /* ========================================================================
           Table (diagnostics)
           ======================================================================== */
        .rt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .rt-table th, .rt-table td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid var(--rt-border);
        }
        .rt-table th {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--rt-text-muted);
            background: var(--rt-surface-2);
        }
        .rt-table td.rt-mono, .rt-table td.rt-num {
            font-family: var(--rt-font-mono);
            font-variant-numeric: tabular-nums;
        }
        .rt-table tbody tr:hover { background: var(--rt-hover-tint); }

        /* Peak-row highlight: the single day in the window with the largest
           absolute daily move. Gold tint (warning hue) so it reads as
           "notice this" without competing with up/down color semantics. */
        .rt-table tbody tr.rt-table__row--peak {
            background: var(--rt-warning-bg);
        }
        .rt-table tbody tr.rt-table__row--peak:hover {
            background: var(--rt-warning-bg);
        }
        .rt-table tbody tr.rt-table__row--peak td {
            font-weight: 700;
        }

        /* ========================================================================
           Signal timeline (Episode Metrics → Daily returns detail)
           Gantt-style band: one column per trading day, signal bars span their
           rolling-window days and a dot marks the anchor (trigger) day.
           ======================================================================== */
        .rt-signal-timeline {
            padding: 12px 14px;
            border: 1px solid var(--rt-border);
            border-radius: var(--rt-r-md);
            background: var(--rt-surface-2);
            overflow-x: auto;
        }
        .rt-signal-timeline__legend {
            font-size: 11px;
            color: var(--rt-text-muted);
            letter-spacing: 0.3px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .rt-signal-timeline__grid {
            display: grid;
            gap: 4px 2px;
            align-items: center;
            min-width: 100%;
        }
        .rt-signal-timeline__day {
            font-family: var(--rt-font-mono);
            font-size: 10px;
            color: var(--rt-text-muted);
            text-align: center;
            padding: 3px 2px;
            border-bottom: 1px solid var(--rt-border);
            grid-row: 1;
        }
        .rt-signal-timeline__day--peak {
            color: var(--rt-warning);
            font-weight: 700;
            background: var(--rt-warning-bg);
            border-bottom-color: var(--rt-warning-br);
            border-radius: 3px 3px 0 0;
        }
        .rt-signal-timeline__bar {
            position: relative;
            height: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 22px 0 8px;
            overflow: hidden;
        }
        .rt-signal-timeline__bar--up {
            background: var(--rt-success-bg);
            border: 1px solid var(--rt-success-br);
        }
        .rt-signal-timeline__bar--down {
            background: var(--rt-danger-bg);
            border: 1px solid var(--rt-danger-br);
        }
        /* Signal baseline predates window_start (data-source edge case).
           Left edge becomes dashed to signal "extends off-screen". */
        .rt-signal-timeline__bar--clipped-left {
            border-left-style: dashed;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        .rt-signal-timeline__bar-label {
            font-family: var(--rt-font-mono);
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .rt-signal-timeline__bar--up .rt-signal-timeline__bar-label { color: var(--rt-success); }
        .rt-signal-timeline__bar--down .rt-signal-timeline__bar-label { color: var(--rt-danger); }
        .rt-signal-timeline__anchor {
            position: absolute;
            right: 6px;
            top: 50%;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            transform: translateY(-50%);
        }
        .rt-signal-timeline__bar--up .rt-signal-timeline__anchor {
            background: var(--rt-success);
            box-shadow: 0 0 0 2px var(--rt-success-bg);
        }
        .rt-signal-timeline__bar--down .rt-signal-timeline__anchor {
            background: var(--rt-danger);
            box-shadow: 0 0 0 2px var(--rt-danger-bg);
        }

        /* ========================================================================
           Details / expandable
           ======================================================================== */
        details.rt-details {
            border: 1px solid var(--rt-border);
            border-radius: var(--rt-r-md);
            background: var(--rt-surface-2);
        }
        details.rt-details > summary {
            cursor: pointer;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--rt-text-secondary);
            letter-spacing: 0.3px;
            user-select: none;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        details.rt-details > summary::-webkit-details-marker { display: none; }
        details.rt-details > summary::after {
            content: '＋';
            font-family: var(--rt-font-mono);
            color: var(--rt-text-muted);
            transition: transform 0.15s ease;
        }
        details.rt-details[open] > summary::after { content: '−'; }
        details.rt-details > summary:hover { color: var(--rt-text); }
        details.rt-details > .rt-details__body {
            padding: 0 14px 14px;
        }

        /* ========================================================================
           Direction pill (up / down arrow + percentage)
           ======================================================================== */
        .rt-direction {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: var(--rt-r-sm);
            font-family: var(--rt-font-mono);
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 600;
        }
        .rt-direction--up   { color: var(--rt-success); background: var(--rt-success-bg); }
        .rt-direction--down { color: var(--rt-danger);  background: var(--rt-danger-bg); }

        /* ========================================================================
           Layout utilities
           ======================================================================== */
        .rt-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .rt-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .rt-grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .rt-stack > * + * { margin-top: 20px; }
        .rt-stack-sm > * + * { margin-top: 12px; }
        .rt-flex { display: flex; align-items: center; gap: 12px; }
        .rt-flex-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .rt-text-secondary { color: var(--rt-text-secondary); }
        .rt-text-muted { color: var(--rt-text-muted); }
        .rt-text-success { color: var(--rt-success); }
        .rt-text-danger  { color: var(--rt-danger); }
        .rt-divider {
            border: none;
            border-top: 1px solid var(--rt-border);
            margin: 24px 0;
        }

        /* ========================================================================
           Responsive
           ======================================================================== */
        @media (max-width: 900px) {
            .rt-grid-2 { grid-template-columns: 1fr; }
            .rt-grid-3 { grid-template-columns: 1fr; }
            .rt-routing-banner { flex-direction: column; align-items: stretch; }
            .rt-routing-banner__desc { max-width: 100%; text-align: left; }
            .rt-hero__title { font-size: 22px; }
            .rt-navbar__links { display: none; }
            .rt-container { padding: 16px 16px 48px; }
        }

        /* ========================================================================
           Spinner (loading)
           ======================================================================== */
        .rt-spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--rt-surface-2);
            border-top-color: var(--rt-accent);
            border-radius: 50%;
            animation: rt-spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes rt-spin { to { transform: rotate(360deg); } }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="rt-navbar">
        <a href="{{ url_for('routes.home') }}" class="rt-navbar__brand">
            <span class="rt-navbar__brand-label">Research Terminal</span>
        </a>
        <div class="rt-navbar__links">
            <a href="{{ url_for('routes.verification_review') }}" class="rt-navbar__link{% if request.endpoint == 'routes.verification_review' %} is-active{% endif %}">Test Episodes</a>
        </div>
    </nav>

    <main class="rt-main">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
