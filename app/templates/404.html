{% extends "base.html" %}
{% block title %}404 · Not Found{% endblock %}

{% block content %}
<div class="rt-container rt-container--narrow" style="min-height: calc(100vh - 52px); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
    <div class="rt-hero__eyebrow">Error · 404</div>
    <h1 class="rt-hero__title" style="font-size: 28px; margin-top: 8px;">Page not found</h1>
    <p style="margin-top: 12px; max-width: 520px; font-size: 13px; color: var(--rt-text-secondary); line-height: 1.6;">
        The page you are looking for doesn't exist, was moved, or is temporarily unavailable.
    </p>
    <a href="{{ url_for('routes.home') }}" class="rt-btn rt-btn--primary" style="margin-top: 20px;">
        ← Back to Markets
    </a>
</div>
{% endblock %}
